name: News flash ingest

# Google News RSS から最新クマ関連ニュースを 1 時間ごとに取り込む高頻度ジョブ。
# 67 自治体ソースを集約する refresh-sightings (1 日 2 回・1 回 20 分) と分離し、
# こちらは数分で終わる軽量フローに保つことで、報道速報レベルの鮮度
# (発生 → 反映が概ね 1 時間以内) を実現する。
#
# private repo の Actions 無料枠 (2,000 min/月) 内に収めるため、
# 1 回 1〜2 分・1 時間ごと = 月 1,500 min 弱を上限とする。
# refresh-sightings.yml (月 1,200 min) と合わせると合計 ~2,700 min。
# 超過リスクが出てきたら repo を public 化するか、頻度を 2h に落とす。

on:
  schedule:
    # 5 分間隔。URL 重複キャッシュにより既処理記事は Gemini を呼ばずに
    # 即終了するため、5 分間隔でも実質コストは無新着時はゼロ近い。
    # repo public 化後は Actions 無制限なので積極的に詰める。
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# sightings.json への書き込みを refresh-sightings / sharp9110-flash と
# 直列化することで push 衝突を防ぐ。同じ group "sightings-write" に統一。
concurrency:
  group: sightings-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Ingest news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ingest:news

      - name: Commit and push (with rebase retry)
        id: commit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if git diff --quiet public/data/sightings.json; then
            echo "No new news records — skipping commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # concurrency group があっても、ローカルからの code push や別ワークフロー
          # の git push と race することがある。コンフリクト時は origin/main に
          # 戻して ingest を再実行 (dedup により Gemini コストは最小限) → push。
          for attempt in 1 2 3 4 5; do
            git add public/data/sightings.json
            git commit -m "News flash: ingest fresh news ($(date -u +%Y-%m-%dT%H:%M))" || true
            git fetch origin main
            if git rebase origin/main; then
              if git push; then
                echo "committed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "[news-flash] push/rebase failed (attempt $attempt) — re-running ingest"
            git reset --hard origin/main
            npm run ingest:news
            if git diff --quiet public/data/sightings.json; then
              echo "No new records after re-ingest — done"
              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 指数寄りのバックオフ + ジッタ。長めの一過性 push フレークを乗り切る。
            backoff=$(( attempt * 3 + (RANDOM % 4) ))
            echo "[news-flash] retrying in ${backoff}s"
            sleep "$backoff"
          done
          echo "Failed after 5 attempts"
          exit 1

      - name: Dispatch Web Push for new sightings
        if: steps.commit.outputs.committed == 'true'
        env:
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        run: |
          # 直前のコミット (HEAD) と 1 つ前 (HEAD~1) で sightings.json を比較し、
          # 追加された records を抽出する。muni 単位でグルーピングして
          # Vercel の /api/push/dispatch に渡し、購読者に通知する。
          #
          # PUSH_DISPATCH_SECRET 未設定時は通知機能オフとみなしてスキップ。
          if [ -z "${PUSH_DISPATCH_SECRET}" ]; then
            echo "PUSH_DISPATCH_SECRET not set — skipping push dispatch"
            exit 0
          fi
          git show HEAD~1:public/data/sightings.json 2>/dev/null > /tmp/prev.json || echo '{"records":[]}' > /tmp/prev.json
          git show HEAD:public/data/sightings.json > /tmp/curr.json
          # 新規 records だけ (id が prev に存在しないもの)。
          # 74k+ records 規模で O(n²) になると 10 分タイムアウトを越えるので、
          # prev の id を一度だけ INDEX で hash set 化して O(1) lookup に。
          jq -n \
            --slurpfile prev /tmp/prev.json \
            --slurpfile curr /tmp/curr.json \
            '($prev[0].records | INDEX(.id)) as $seen
             | { newRecords: ($curr[0].records | map(select($seen[.id] == null))) }' \
            > /tmp/dispatch.json
          COUNT=$(jq '.newRecords | length' /tmp/dispatch.json)
          echo "[news-flash] $COUNT new records to dispatch"
          if [ "$COUNT" -eq 0 ]; then exit 0; fi
          # ペイロードを軽量化。lat/lon は観光地 (spot) 通知の近傍判定に使う。
          jq '{ newRecords: (.newRecords | map({id, prefectureName, cityName, sectionName, lat, lon, date, time, dateEstimated, comment, sourceUrl, sourceKind})) }' \
            /tmp/dispatch.json > /tmp/dispatch-slim.json
          # curl は最大 60 秒で諦める。Vercel function が応答しない場合に
          # job 全体がブロックされないよう保険を入れる。
          RESPONSE=$(curl -sS --max-time 60 -o /tmp/resp.json -w "%{http_code}" \
            -X POST "https://kuma-watch.jp/api/push/dispatch?source=news-flash" \
            -H "Authorization: Bearer ${PUSH_DISPATCH_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dispatch-slim.json) || true
          echo "[news-flash] dispatch http=$RESPONSE"
          cat /tmp/resp.json || true
          # 配信失敗は ingest 成功を上書きしない (exit 0)
          exit 0

      - name: Dispatch LINE for new sightings
        if: steps.commit.outputs.committed == 'true'
        env:
          PUSH_DISPATCH_SECRET: ${{ secrets.PUSH_DISPATCH_SECRET }}
        # Web Push 配信ステップで作った /tmp/dispatch-slim.json をそのまま
        # /api/line/dispatch に渡す。LINE 側は独自の重複送信セット
        # (ldispatched:*) を持つので、Web Push と二重送信にはならない。
        # 認証シークレットは Web Push と共用 (PUSH_DISPATCH_SECRET)。
        run: |
          if [ -z "${PUSH_DISPATCH_SECRET}" ]; then
            echo "PUSH_DISPATCH_SECRET not set — skipping LINE dispatch"
            exit 0
          fi
          if [ ! -f /tmp/dispatch-slim.json ]; then
            echo "[line] dispatch-slim.json not found — skipping"
            exit 0
          fi
          RESPONSE=$(curl -sS --max-time 60 -o /tmp/resp-line.json -w "%{http_code}" \
            -X POST "https://kuma-watch.jp/api/line/dispatch?source=news-flash" \
            -H "Authorization: Bearer ${PUSH_DISPATCH_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dispatch-slim.json) || true
          echo "[line] dispatch http=$RESPONSE"
          cat /tmp/resp-line.json || true
          # 配信失敗は ingest 成功を上書きしない (exit 0)
          exit 0

      - name: Post important alerts to X
        if: steps.commit.outputs.committed == 'true'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        # Push 配信ステップで作った /tmp/dispatch-slim.json をそのまま渡す。
        # X credentials が未設定なら post-x-alert.ts 側で skip (非エラー)。
        run: |
          if [ ! -f /tmp/dispatch-slim.json ]; then
            echo "[x-alert] dispatch-slim.json not found — skipping"
            exit 0
          fi
          npm run x:alert -- /tmp/dispatch-slim.json || true
