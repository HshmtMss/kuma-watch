name: Muni messages ingest

# 自治体のクマ注意喚起ページ(bearUrl)から住民向けメッセージを Gemini で抽出し、
# src/data/muni-messages-generated.json を更新する。観光地ページ(/spot)の
# 「自治体からのお知らせ」を自動拡充。実装は scripts/ingest-muni-messages.ts。
#
# 週次・1 回 40 自治体ずつ(未取込 or 21日以上前のものを再取込)。bearUrl は約 726 件
# あるため数週かけて全体を巡回し、その後は古いものから自動更新される。

on:
  schedule:
    # 毎週水曜 03:00 UTC = 12:00 JST。
    - cron: '0 3 * * 3'
  workflow_dispatch:
    inputs:
      limit:
        description: '1 回で処理する自治体数'
        required: false
        default: '40'

permissions:
  contents: write

concurrency:
  group: muni-messages-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --prefer-offline --no-audit

      - name: Ingest muni messages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run ingest:muni-messages -- --all --limit=${{ github.event.inputs.limit || '40' }}

      - name: Commit and push (with rebase retry)
        run: |
          if git diff --quiet src/data/muni-messages-generated.json; then
            echo "No muni-message changes — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/muni-messages-generated.json
          git commit -m "Muni messages: auto-ingest ($(date -u +%Y-%m-%dT%H:%M))"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # cron は別ファイルしか触らないので rebase は基本衝突しない。
            if git rebase origin/main; then
              if git push; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "unexpected rebase conflict"
              exit 1
            fi
            backoff=$(( attempt * 3 + (RANDOM % 4) ))
            echo "push failed (attempt $attempt) — retry in ${backoff}s"
            sleep "$backoff"
          done
          echo "Failed after 5 attempts"
          exit 1
