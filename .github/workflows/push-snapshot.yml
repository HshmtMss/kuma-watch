name: Push registration snapshot

# 通知登録数の日次スナップショットを保存 (/api/cron/push-snapshot)。
# 管理画面(通知登録)で登録数の推移を表示するためのデータを push:hist に貯める。
# 同日再実行は上書き（冪等）。

on:
  schedule:
    # 毎日 15:10 UTC = 翌 00:10 JST（その日ぶんの締めとして記録）。
    - cron: "10 15 * * *"
  workflow_dispatch: {}

concurrency:
  group: push-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Record push snapshot
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi
          RESPONSE=$(curl -sS --max-time 60 -o /tmp/snap.json -w "%{http_code}" \
            -X POST "https://kuma-watch.jp/api/cron/push-snapshot" \
            -H "Authorization: Bearer ${CRON_SECRET}") || true
          echo "[push-snapshot] http=$RESPONSE"
          jq '.snapshot' /tmp/snap.json 2>/dev/null || cat /tmp/snap.json
