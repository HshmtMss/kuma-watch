name: Refresh sightings data

# 1日 2 回 67 自治体ソース + Sharp9110 を集約し、差分があれば
# public/data/sightings.json を更新コミットして Vercel の自動デプロイをトリガーする。
#
# 手動実行は GitHub UI の "Run workflow" ボタンから可能。

on:
  schedule:
    # 4 時間間隔 (1日 6 回)。public repo 化により Actions 無制限なので
    # 各時間帯の自治体掲載をカバー。
    # UTC 18:00 = JST 03:00 / UTC 22:00 = JST 07:00 / UTC 02:00 = JST 11:00 /
    # UTC 06:00 = JST 15:00 / UTC 10:00 = JST 19:00 / UTC 14:00 = JST 23:00
    # 自治体側サーバー負荷を考えても、6x/日は許容範囲。
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

# git push に必要
permissions:
  contents: write

# sightings.json への書き込みを直列化。news-flash / sharp9110-flash と
# 同じグループ "sightings-write" にすることで、refresh-sightings の 20 分
# 実行中に他ジョブが新規コミットを入れて push 衝突 → 失敗する事故を防ぐ。
concurrency:
  group: sightings-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # CI runner (US) から日本の 67 自治体サイトを叩くため、ローカル (~4分)
    # より相当遅くなる。LLM 抽出 (Gemini) も含めると 15 分では足りないので
    # 30 分まで許容する。GitHub Actions 無料枠 (private 2,000 分/月) には十分余裕。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Aggregate sightings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEMONOTE_USERNAME: ${{ secrets.KEMONOTE_USERNAME }}
          KEMONOTE_PASSWORD: ${{ secrets.KEMONOTE_PASSWORD }}
          # ジオコードキャッシュ (data/geocode-cache.json) を書き戻すのはこのジョブだけ。
          # 他の取り込みジョブ (news-flash 等) が書くと作業ツリーが汚れ、直後の
          # git pull --rebase が "You have unstaged changes" で失敗する。
          GEOCODE_CACHE_PERSIST: "1"
        # 一時的なネットワーク障害で失敗することがある (GitHub Actions 側から
        # 自治体サイトへの Connect Timeout、ArcGIS 側の一時的な不調など)。
        # その場合は激減ガードが働いてスナップショットを守るが、ジョブとしては
        # 失敗するので通知が飛ぶ。4 時間ごとに 1 通ずつ来ると通知が意味を失うので、
        # 間を置いて再試行し、それでも駄目なときだけ失敗させる。
        #
        # 待ちは 60 秒では足りなかった。2026-09-03 は福島・新潟 (どちらも ArcGIS)
        # が数分にわたり不調で、3 回とも 2 分以内に終わって空振りした。ソースが
        # 163 本あると「どれか 1 本が数分だけ不調」は定期的に起きる。失敗する回は
        # ガードで早く止まる (1 回 1〜2 分) ので、間隔を延ばしても 30 分枠に収まる。
        run: |
          for attempt in 1 2 3 4; do
            if npm run build:sightings; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "[refresh] 集約に失敗 (試行 $attempt/4) — 240 秒後に再試行"
              sleep 240
            fi
          done
          echo "[refresh] 4 回とも失敗しました"
          exit 1

      - name: Commit if changed
        run: |
          # ジオコードキャッシュ (data/geocode-cache.json) も一緒にコミットする。
          # ここを残さないと字単位の座標を毎回引き直すことになり、Nominatim の
          # 1 req/sec 制限で 30 分枠に載らない。新しい地名が増えた分だけ差分が出る。
          if git diff --quiet public/data/sightings.json data/geocode-cache.json; then
            echo "No changes — skipping commit"
            exit 0
          fi
          # ジオコードキャッシュは和集合でマージする。CI と手元の両方が追記する
          # 辞書なので、行単位だと毎回コンフリクトし、どちらかを捨てると
          # 引き直しが発生する (実際に何度も起きた)。
          git config merge.geocodecache.name "geocode cache union merge"
          git config merge.geocodecache.driver "node scripts/merge-geocode-cache.mjs %O %A %B"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sightings.json data/geocode-cache.json
          git commit -m "Refresh sightings data ($(date -u +%Y-%m-%d))"
          # 防御的 rebase + リトライ。concurrency group で直列化はされているが、
          # 別グループ(gov)・手動 push・稀な push 自体の一過性失敗を耐えるため、
          # push 前に最新を取り込み直す。commit は「全件再生成」なので衝突は ours で上書き。
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X ours origin main
            if git push; then
              exit 0
            fi
            backoff=$(( attempt * 3 + (RANDOM % 4) ))
            echo "[refresh] push failed (attempt $attempt) — retrying in ${backoff}s"
            sleep "$backoff"
          done
          echo "Failed after 5 attempts"
          exit 1
